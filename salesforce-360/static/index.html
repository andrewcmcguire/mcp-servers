<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salesforce 360</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1117;
    color: #e4e4e7;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid #27272a;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #18181b;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #fafafa;
  }

  header .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulse 2s infinite;
  }

  header .status {
    font-size: 13px;
    color: #71717a;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    max-width: 720px;
    line-height: 1.6;
    font-size: 15px;
  }

  .message.user {
    align-self: flex-end;
    background: #2563eb;
    color: #fff;
    padding: 12px 16px;
    border-radius: 16px 16px 4px 16px;
    max-width: 480px;
  }

  .message.assistant {
    align-self: flex-start;
    background: #27272a;
    padding: 16px 20px;
    border-radius: 4px 16px 16px 16px;
  }

  .message.assistant strong { color: #fbbf24; }
  .message.assistant ul { margin: 8px 0; padding-left: 20px; }
  .message.assistant li { margin: 4px 0; }
  .message.assistant code {
    background: #3f3f46;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .message.assistant p { margin: 8px 0; }
  .message.assistant p:first-child { margin-top: 0; }
  .message.assistant p:last-child { margin-bottom: 0; }

  .message.system {
    align-self: center;
    color: #71717a;
    font-size: 13px;
    font-style: italic;
  }

  .thinking {
    align-self: flex-start;
    display: flex;
    gap: 6px;
    padding: 12px 16px;
  }

  .thinking span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #52525b;
    animation: bounce 1.4s infinite;
  }

  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-8px); }
  }

  #input-area {
    padding: 16px 24px 24px;
    border-top: 1px solid #27272a;
    background: #18181b;
  }

  #input-row {
    display: flex;
    gap: 12px;
    max-width: 720px;
    margin: 0 auto;
  }

  #message-input {
    flex: 1;
    padding: 14px 18px;
    border: 1px solid #3f3f46;
    border-radius: 12px;
    background: #27272a;
    color: #fafafa;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    resize: none;
    min-height: 48px;
    max-height: 120px;
  }

  #message-input:focus { border-color: #2563eb; }
  #message-input::placeholder { color: #52525b; }

  #send-btn {
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  #send-btn:hover { background: #1d4ed8; }
  #send-btn:disabled { background: #3f3f46; cursor: not-allowed; }

  .quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 12px;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
  }

  .quick-btn {
    padding: 8px 14px;
    border: 1px solid #3f3f46;
    border-radius: 8px;
    background: transparent;
    color: #a1a1aa;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }

  .quick-btn:hover {
    border-color: #2563eb;
    color: #e4e4e7;
  }

  .welcome {
    text-align: center;
    padding: 60px 24px;
    max-width: 560px;
    margin: auto;
  }

  .welcome h2 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #fafafa;
  }

  .welcome p {
    color: #71717a;
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 32px;
  }
</style>
</head>
<body>
  <header>
    <h1>Salesforce 360</h1>
    <div class="dot" id="status-dot"></div>
    <span class="status" id="status-text">Connected</span>
  </header>

  <div id="chat">
    <div class="welcome" id="welcome">
      <h2>Your accounts. Your pipeline. One question away.</h2>
      <p>Ask anything about your Salesforce data — accounts, deals, contacts, tasks, forecast. No tabs. No clicking. Just answers.</p>
    </div>
  </div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="message-input" placeholder="Ask about your accounts, pipeline, or day..." rows="1"></textarea>
      <button id="send-btn">Send</button>
    </div>
    <div class="quick-actions" id="quick-actions">
      <button class="quick-btn" data-msg="What do I need to know today?">Today's briefing</button>
      <button class="quick-btn" data-msg="Show me my pipeline by stage">Pipeline</button>
      <button class="quick-btn" data-msg="Which deals are at risk?">At-risk deals</button>
      <button class="quick-btn" data-msg="Show me my forecast for the next 3 months">Forecast</button>
      <button class="quick-btn" data-msg="What changed in my pipeline this week?">Deal changes</button>
    </div>
  </div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('message-input');
const sendBtn = document.getElementById('send-btn');
const welcome = document.getElementById('welcome');
const quickActions = document.getElementById('quick-actions');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

let conversationHistory = [];
let isLoading = false;

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// Send on Enter (Shift+Enter for newline)
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

// Quick action buttons
document.querySelectorAll('.quick-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    input.value = btn.dataset.msg;
    sendMessage();
  });
});

function addMessage(role, content) {
  if (welcome) welcome.style.display = 'none';
  if (role === 'user') quickActions.style.display = 'none';

  const div = document.createElement('div');
  div.className = `message ${role}`;

  if (role === 'assistant') {
    div.innerHTML = formatMarkdown(content);
  } else {
    div.textContent = content;
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addThinking() {
  const div = document.createElement('div');
  div.className = 'thinking';
  div.id = 'thinking';
  div.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeThinking() {
  const el = document.getElementById('thinking');
  if (el) el.remove();
}

function formatMarkdown(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>')
    .replace(/^(?!<[uol]|<li)(.+)$/gm, '<p>$1</p>')
    .replace(/<p><\/p>/g, '');
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;
  input.value = '';
  input.style.height = 'auto';

  addMessage('user', text);
  addThinking();

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        history: conversationHistory,
      }),
    });

    removeThinking();

    if (!resp.ok) {
      const err = await resp.json();
      addMessage('system', err.error || 'Something went wrong. Check that your Salesforce credentials and Anthropic API key are set.');
      return;
    }

    const data = await resp.json();
    conversationHistory = data.history || [];
    addMessage('assistant', data.response);

  } catch (err) {
    removeThinking();
    addMessage('system', 'Connection error. Is the server running?');
    statusDot.style.background = '#ef4444';
    statusText.textContent = 'Disconnected';
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

// Check health on load
fetch('/health')
  .then(r => r.json())
  .then(d => {
    if (d.status === 'ok') {
      statusText.textContent = `Connected to ${d.instance || 'Salesforce'}`;
    } else {
      statusDot.style.background = '#ef4444';
      statusText.textContent = d.error || 'Not connected';
    }
  })
  .catch(() => {
    statusDot.style.background = '#ef4444';
    statusText.textContent = 'Server not responding';
  });
</script>
</body>
</html>
